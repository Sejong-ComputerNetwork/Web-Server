<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>관리자 페이지</title>
    <link rel="stylesheet" href="admin-style.css" />
  </head>

  <body>
    <div class="container">
      <h2>출석 현황 관리</h2>

      <table id="studentTable">
        <thead>
          <tr>
            <th>관리</th>
            <th>학번</th>
            <th>이름</th>
            <th>출석</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>

      <div class="add-student">
        <label>학번:</label>
        <input type="text" id="newId" placeholder="학번 입력" />
        <label>이름:</label>
        <input type="text" id="newName" placeholder="이름 입력" />
        <button onclick="addStudent()">학생 추가</button>
      </div>

      <button id="editBtn" onclick="toggleEditMode()">편집 모드</button>
      
      <button class="home-btn" onclick="location.href='/'">
    메인으로 돌아가기
       </button>
    </div>

    <script>
      let editMode = false;
      let students = [];

      window.onload = loadStudents;

      // 1. 목록 불러오기
      async function loadStudents() {
        try {
            const res = await fetch("/api/students");
            if (!res.ok) throw new Error("API Error");
            students = await res.json();
        } catch(e) {
            console.error(e);
            // alert("서버 연결 실패");
        }
        renderTable();
      }

      // 2. 테이블 그리기
      function renderTable() {
        const tbody = document.querySelector("#studentTable tbody");
        tbody.innerHTML = ""; 

        students.forEach((stu, index) => {
          const row = document.createElement("tr");

          if (!editMode) {
            // [보기 모드]
            row.innerHTML = `
              <td>-</td>
              <td>${stu.id}</td>
              <td>${stu.name}</td>
              <td>
                <input type="checkbox" class="circle-check" ${stu.attend ? "checked" : ""} disabled>
              </td>
            `;
          } else {
            // [편집 모드] - 학번은 수정하면 꼬일 수 있으니 disabled 처리
            row.innerHTML = `
              <td><button class="delete-btn" onclick="deleteStudent('${stu.id}')">삭제</button></td>
              <td><input class="edit-id" value="${stu.id}" disabled style="background:#eee;"></td>
              <td><input class="edit-name" value="${stu.name}"></td>
              <td><input type="checkbox" class="edit-attend" ${stu.attend ? "checked" : ""}></td>
            `;
          }
          tbody.appendChild(row);
        });
      }

      // 3. [기능 구현] 학생 삭제
      async function deleteStudent(id) {
        if(!confirm("정말 삭제하시겠습니까?")) return;

        try {
            const res = await fetch("/api/students", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id })
            });

            if (res.ok) {
                alert("삭제 성공!");
                loadStudents(); // 목록 갱신
            } else {
                alert("삭제 실패");
            }
        } catch (e) {
            console.error(e);
        }
      }

      // 4. 학생 추가
      async function addStudent() {
        const id = document.getElementById("newId").value.trim();
        const name = document.getElementById("newName").value.trim();

        if (!id || !name) return alert("학번과 이름을 입력하세요");

        const res = await fetch("/api/students", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id, name }),
        });

        if (res.status === 201) {
            alert("추가되었습니다.");
            document.getElementById("newId").value = "";
            document.getElementById("newName").value = "";
            loadStudents();
        } else {
            alert("추가 실패 (중복 학번 등)");
        }
      }

      // 5. [기능 구현] 편집 모드 토글 & 일괄 저장
      async function toggleEditMode() {
        const btn = document.getElementById("editBtn");

        if (!editMode) {
          // --> 편집 모드로 진입
          editMode = true;
          btn.innerText = "변경사항 저장 (Save)";
          btn.style.backgroundColor = "#dc3545"; // 빨간색 (저장 의미)
          renderTable();
        } else {
          // --> 저장하고 나가기
          const tbody = document.querySelector("#studentTable tbody");
          const ids = tbody.querySelectorAll(".edit-id");
          const names = tbody.querySelectorAll(".edit-name");
          const attends = tbody.querySelectorAll(".edit-attend");

          // 변경된 내용들을 하나씩 서버로 보냄 (PUT)
          for(let i=0; i<ids.length; i++) {
              const id = ids[i].value;
              const name = names[i].value;
              const attend = attends[i].checked;

              await fetch("/api/students", {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ id: id, name: name, attend: attend })
              });
          }

          alert("저장되었습니다.");
          editMode = false;
          btn.innerText = "편집 모드";
          btn.style.backgroundColor = "#4caf50"; // 원래 색 복구
          loadStudents();
        }
      }
    </script>
  </body>
</html>
